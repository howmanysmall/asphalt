# release.yml is generated by cargo-dist (`dist generate`) with hand-added
# sccache steps. Its template-injection patterns, broad release permissions,
# artifact/sccache caching, and dynamic container image are inherent to
# cargo-dist's workflow design and are not actionable without forking the
# generator, so they are ignored for that file.
rules:
  template-injection:
    ignore:
      - release.yml
  excessive-permissions:
    ignore:
      - release.yml
  cache-poisoning:
    ignore:
      - release.yml
  unpinned-images:
    ignore:
      - release.yml
  # Require at least a ref (tag/branch) pin on `uses:` rather than zizmor's
  # default blanket hash-pin policy. Hash-pinning floating refs like
  # dtolnay/rust-toolchain@stable or bnjbvr/cargo-machete@main would freeze
  # their semantics, and tag pins keep ci.yml diff-identical to upstream.
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
